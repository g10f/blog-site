{% load navigation_tags wagtailcore_tags %}

<ul class="dropdown-menu" aria-labelledby="dropdown-{{ parent.pk }}">
  {% for item in menuitems_children %}
    {% with child=item.localized %}
      <li><a class="dropdown-item" href="{% pageurl child %}">{{ child.title }}</a></li>
    {% endwith %}
  {% endfor %}
</ul>
