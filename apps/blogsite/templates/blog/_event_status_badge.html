{% if event.status_text %}
  <span class="badge {% if event.is_cancelled %}text-bg-danger{% elif event.is_booked_up and not event.is_past %}text-bg-warning{% elif event.is_waitlist_only and event.is_registration_possible %}text-bg-info{% else %}text-bg-success{% endif %}">{{ event.status_text|capfirst }}</span>
{% endif %}
